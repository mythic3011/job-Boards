name: Shell Scripts

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-scripts:
    name: Validate Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Syntax check all shell scripts
        shell: bash
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          [ "${#scripts[@]}" -gt 0 ] || { echo "No shell scripts found"; exit 0; }

          failed=0
          for script in "${scripts[@]}"; do
            first_line="$(head -n 1 "$script" || true)"
            case "$first_line" in
              *bash*)
                bash -n "$script" || failed=1
                ;;
              *)
                sh -n "$script" || failed=1
                ;;
            esac
          done

          [ "$failed" -eq 0 ]

      # Legacy scripts contain known warnings. Keep error-level checks for the
      # whole repository, and enforce warning-level quality on PR changes.
      - name: Lint shell scripts (errors across repo, warnings on changes)
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          [ "${#scripts[@]}" -gt 0 ] || exit 0
          shellcheck -x -S error "${scripts[@]}"
          if [ -n "$BASE_REF" ]; then
            mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF"...HEAD -- '*.sh')
            if [ "${#changed[@]}" -gt 0 ]; then
              shellcheck -x -S warning "${changed[@]}"
            fi
          fi
