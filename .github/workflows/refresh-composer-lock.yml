name: One-time Composer security refresh
on:
  push:
    branches: [feat/shp-php85-deploy]
    paths:
      - .github/workflows/refresh-composer-lock.yml
permissions:
  contents: write
jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Obtain Composer binary
        run: |
          docker create --name composer-source composer:2
          docker cp composer-source:/usr/bin/composer composer.phar
          docker rm composer-source
      - name: Refresh locked dependencies using PHP 8.5.12
        run: |
          docker run --rm -v "$PWD:/app" -w /app php:8.5.12-cli-bookworm \
            php composer.phar update --no-install --no-scripts --no-plugins \
            --with-all-dependencies --ignore-platform-req=ext-* --no-interaction
      - name: Commit only composer.lock
        run: |
          git status --short
          if git diff --quiet -- composer.lock; then
            echo "No lockfile changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "fix(deps): refresh vulnerable Composer lockfile"
          git push origin HEAD:feat/shp-php85-deploy
