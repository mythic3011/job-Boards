name: SHP PHP deployment
on:
  pull_request:
    paths:
      - deploy.sh
      - deploy/shp/**
      - plugins/job-boards-app/**
      - plugins/postgres-lite/**
      - composer.json
      - composer.lock
      - package.json
      - package-lock.json
      - .github/workflows/shp-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shp-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax and ShellCheck (new deployment only)
        run: |
          bash -n deploy.sh deploy/shp/bootstrap.sh plugins/job-boards-app/hooks/pre-up.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning deploy.sh deploy/shp/bootstrap.sh plugins/job-boards-app/hooks/pre-up.sh
      - name: Test deploy.sh safety guards without Docker
        run: bash tests/shp/deploy-guard.sh
      - name: Verify deployment contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          deploy = Path("deploy.sh").read_text()
          dockerfile = Path("deploy/shp/Dockerfile").read_text()
          compose = Path("plugins/job-boards-app/compose.yaml").read_text()
          plugin = Path("plugins/job-boards-app/plugin.yaml").read_text()
          db = Path("plugins/postgres-lite/compose.yaml").read_text()
          assert "8.5.12-apache-bookworm@sha256:" in dockerfile
          assert 'version_compare(PHP_VERSION, "8.5.12", "<")' in dockerfile
          assert "BIND_ADDRESS=127.0.0.1" in deploy
          assert "JOB_BOARDS_ALLOW_PUBLIC_BIND" in deploy
          assert "--ignore-unfixed" not in deploy
          assert "database:postgres-lite" in plugin
          assert "postgres-exporter" not in db
          assert "migrate --force --no-interaction" in compose
          assert 'DB_QUEUE_RETRY_AFTER: "360"' in compose
          assert '"--timeout=300"' in compose
          assert "session.upload_progress.enabled = 0" in Path("deploy/shp/php.ini").read_text()
          assert "ports:" not in compose
          print("Static contract passed; runtime not verified")
          PY
  image-build:
    # Does not need access to private SHP; catches actual Docker/PHP/Composer
    # regressions instead of relying only on static string assertions.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build PHP 8.5.12 runtime and Vite assets
        run: docker build --pull --file deploy/shp/Dockerfile --tag job-boards:ci .
      - name: Verify PHP version and required extensions
        run: |
          docker run --rm --entrypoint php job-boards:ci -r '
            if (PHP_VERSION_ID < 80512 || PHP_VERSION_ID >= 80600) exit(1);
            foreach (["pdo_pgsql", "pgsql", "gd", "intl", "mbstring", "zip"] as $ext) {
              if (!extension_loaded($ext)) { fwrite(STDERR, "missing extension: $ext\n"); exit(1); }
            }
            if (!extension_loaded("Zend OPcache")) { fwrite(STDERR, "Zend OPcache not loaded\\n"); exit(1); }
            echo PHP_VERSION, PHP_EOL;
          '
      - name: Verify CVE-2026-115560 mitigation in built PHP runtime
        run: |
          docker run --rm --entrypoint php job-boards:ci -r '
            if (ini_get("session.upload_progress.enabled") !== "0") {
              fwrite(STDERR, "CVE-2026-115560 mitigation is not active\\n");
              exit(1);
            }
            echo "Session Upload Progress disabled", PHP_EOL;
          '
      - name: Audit locked production Composer dependencies
        run: docker run --rm --entrypoint composer job-boards:ci audit --no-dev --locked
      - name: Run PHP deployment contract test
        run: |
          docker run --rm --entrypoint sh job-boards:ci -ec '
            composer install --no-interaction --prefer-dist --no-scripts --no-progress
            vendor/bin/phpunit tests/Feature/ShpDeploymentContractTest.php
          '
      - name: Smoke-test migrations, app health, and queue worker
        shell: bash
        run: |
          export CI_APP_KEY="base64:$(openssl rand -base64 32 | tr -d '\\n')"
          docker compose -f deploy/shp/ci-compose.yaml up -d --wait --wait-timeout 240
          for service in app worker; do
            docker compose -f deploy/shp/ci-compose.yaml exec -T "$service" php -r '
              if (ini_get("session.upload_progress.enabled") !== "0") exit(1);
            '
          done
          # PHP CLI and Apache mod_php can have different effective ini settings.
          # Exercise the actual HTTP SAPI inside disposable CI containers only.
          docker compose -f deploy/shp/ci-compose.yaml exec -T app sh -ec '
            probe=public/__ci_session_progress_probe.php
            trap "rm -f \"\$probe\"" EXIT
            printf "%s\\n" "<?php echo ini_get(\"session.upload_progress.enabled\");" > "\$probe"
            test "\$(curl -fsS http://127.0.0.1/__ci_session_progress_probe.php)" = 0
          '
          docker compose -f deploy/shp/ci-compose.yaml exec -T app php artisan migrate:status --no-interaction
          docker compose -f deploy/shp/ci-compose.yaml exec -T app curl -fsS http://127.0.0.1/up
          docker compose -f deploy/shp/ci-compose.yaml exec -T app php artisan route:list --path=up
          test "$(docker compose -f deploy/shp/ci-compose.yaml ps --status running --services | grep -cx worker)" -eq 1
          # Restart must not erase the named Laravel storage volume.
          docker compose -f deploy/shp/ci-compose.yaml exec -T app sh -c 'printf persistent > storage/app/ci-persistence.txt'
          docker compose -f deploy/shp/ci-compose.yaml restart app
          docker compose -f deploy/shp/ci-compose.yaml up -d --wait --wait-timeout 120 app
          docker compose -f deploy/shp/ci-compose.yaml exec -T app sh -c 'test "$(cat storage/app/ci-persistence.txt)" = persistent'
          docker compose -f deploy/shp/ci-compose.yaml exec -T app curl -fsS http://127.0.0.1/up
      - name: Diagnostics and cleanup
        if: always()
        env:
          CI_APP_KEY: cleanup-only
        run: |
          docker compose -f deploy/shp/ci-compose.yaml logs --no-color --tail=120 || true
          docker compose -f deploy/shp/ci-compose.yaml down --volumes --remove-orphans || true
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Set SHP_INTEGRATION_ENABLED repository variable AND a read-only
    # SHP_REPO_TOKEN secret for the private linux_setup repository.
    if: ${{ vars.SHP_INTEGRATION_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned private SHP
        uses: actions/checkout@v4
        with:
          repository: mythic3011/linux_setup
          ref: 982f940daa37b8e4a25823f4dfbf29f460875043
          token: ${{ secrets.SHP_REPO_TOKEN }}
          persist-credentials: false
          path: .deploy/linux_setup
      - name: Configure and validate SHP
        run: |
          ./deploy.sh init
          ./deploy.sh config
          grep -q '^BIND_ADDRESS=127.0.0.1$' .env
      - name: Build and start application
        run: ./deploy.sh up
      - name: Assert PHP patch floor and health
        run: |
          ./deploy.sh check
          docker compose --env-file .env exec -T app php -r 'exit(PHP_VERSION_ID >= 80512 && PHP_VERSION_ID < 80600 ? 0 : 1);'
      - name: Composer security audit
        run: docker compose --env-file .env exec -T app composer audit --no-dev
      - name: Diagnostics on failure
        if: failure()
        run: |
          ./deploy.sh status || true
          docker compose --env-file .env logs --no-color --tail=120 || true
