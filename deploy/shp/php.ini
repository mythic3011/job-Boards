expose_php = Off
# CVE-2026-115560: disable Session Upload Progress before request parsing.
# PHP 8.5.12 does not contain the fix (PHP advisory, 2026-10-23).
session.upload_progress.enabled = 0
memory_limit = 512M
upload_max_filesize = 50M
post_max_size = 60M
max_execution_time = 300
opcache.enable = 1
opcache.validate_timestamps = 0
